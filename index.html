<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151925"><title>专注时刻 · Focus Timer</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div class="brand">◒ <span>专注时刻</span></div><span class="tag">FOCUS TIMER</span></header><section class="card"><p class="eyebrow">GIVE YOURSELF A MOMENT</p><h1>把时间留给重要的事</h1><p class="intro">一次只做一件事，剩下的交给计时器。</p><div class="modes" role="group" aria-label="计时模式"><button data-mode="focus" class="selected">专注</button><button data-mode="short">短休息</button><button data-mode="long">长休息</button></div><div id="time" class="time" aria-live="off">25:00</div><p id="status" class="status" role="status">准备好开始了吗？</p><div class="actions"><button id="toggle" class="primary">开始专注</button><button id="reset" class="secondary">重置</button></div><div class="progress"><span id="bar"></span></div><p class="hint">保持页面打开，切换标签页也会继续计时</p></section><section class="bottom"><div><span class="label">今日完成</span><strong><span id="count">0</span> <small>次专注</small></strong></div><button id="clear" class="link">清除记录</button></section><footer>慢一点，也可以走得很远。</footer></main><script src="app.js"></script></body></html>
